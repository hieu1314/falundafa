<!DOCTYPE html>
<html lang="vi">

<head>
  <link rel="icon" type="image/png" href="icon/falun-logo.jpg">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nơi thức tỉnh tâm linh</title>
  <link rel="stylesheet" href="style.css">
  <script src="common.js" defer></script>
  <script src="thienthu.js" defer></script>
</head>

<body>
  <header class="site-header">
    <h1>Tâm linh tỉnh thức</h1>
    <p class="tagline">
      “Tôi là ai?”, “Tôi từ đâu đến?”, “Tôi sẽ đi về đâu?”
    </p>
  </header>

  <!-- Nút nổi phải -->
  <div id="right-btn" class="floating-btn" onclick="location.href='falundafa.html'"></div>
  <style>
    /* Nút phải liên tục xoay */
    @keyframes spin-9-back-9 {
      0% {
        transform: rotate(0deg);
      }

      25% {
        transform: rotate(3240deg);
      }

      /* 9 vòng * 360° */
      50% {
        transform: rotate(0deg);
      }

      /* 9 vòng ngược */
      75% {
        transform: rotate(-3240deg);
      }

      /* 9 vòng thuận tiếp theo */
      100% {
        transform: rotate(0deg);
      }

      /* lặp lại */
    }

    #right-btn {
      top: 20px;
      right: 20px;
      background: url('icon/falun-logo.jpg') no-repeat center/contain;
      position: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      animation: spin-9-back-9 36s linear infinite;
      /* 36s cho toàn bộ chu kỳ gồm 18 vòng */
    }

#left-btn {
  left: 20px;
  bottom: 20px;
  width: 60px;
  height: 60px;
  background: #f6df8b;
  position: fixed;
  border-radius: 50%;
  cursor: pointer;
  z-index: 9999;

  display: flex;
  justify-content: center;
  align-items: center;
}

#left-btn svg {
  width: 52px;
  height: 35px;
}
  </style>
  <!-- Nút nổi trái -->
  <div id="left-btn" class="floating-btn" onclick="location.href='./quiz/quiz.html'">
  <svg viewBox="0 0 100 50" aria-hidden="true">
    <polyline
      points="0,25 8,25 12,18 16,32 20,10 24,40 28,22 34,25
              40,25 44,15 48,35 52,8 56,42 60,20 66,25
              72,25 76,12 80,38 84,18 88,30 92,22 100,25"
      fill="none"
      stroke="#6b5200"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round" />
  </svg>
</div>

  <main class="grid">

  </main>

  <footer class="site-footer">
    <small>© <span id="year"></span> Người tỉnh thức-Nguyễn Hoàng Hiếu</small>
  </footer>

  <!-- STAR LAYER -->
  <div id="star-layer"></div>

  <!-- SÁCH LAYER -->
  <div id="book-layer"></div>

  <!-- VIEWER -->
  <div id="viewer" class="hidden">
    <span class="close" onclick="closeViewer()">×</span>
    <button id="prevImg">&#10094;</button>
    <img id="viewerImg">
    <button id="nextImg">&#10095;</button>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

</body>

</html>
