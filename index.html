<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nơi thức tỉnh tâm linh</title>
<link rel="stylesheet" href="style.css">
<script src="common.js" defer></script>
</head>
<body>
<header class="site-header">
<h1>Tâm linh tỉnh thức</h1>
<p class="tagline">“Tôi là ai?”, “Tôi từ đâu đến?”, “Tôi sẽ đi về đâu?”</p>
</header>


<!-- Nút nổi phải -->
<div id="right-btn" class="floating-btn" onclick="location.href='falundafa.html'"></div>
<style>
/* Nút phải liên tục xoay */
@keyframes spin-9-back-9 {
  0%    { transform: rotate(0deg); }
  25%   { transform: rotate(3240deg); }  /* 9 vòng * 360° */
  50%   { transform: rotate(0deg); }     /* 9 vòng ngược */
  75%   { transform: rotate(-3240deg); } /* 9 vòng thuận tiếp theo */
  100%  { transform: rotate(0deg); }     /* lặp lại */
}
#right-btn {
 top: 20px;
  right: 20px;
  background: url('icon/falun-logo.jpg') no-repeat center/contain;
    position: fixed;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  animation: spin-9-back-9 36s linear infinite; /* 20s cho toàn bộ 18 vòng */
}
</style>


<main class="grid">

</main>


<footer class="site-footer">
<small>© <span id="year"></span> Người tỉnh thức-Nguyễn Hoàng Hiếu</small>
</footer>

<!-- STAR LAYER -->
<div id="star-layer"></div>

<!-- VIEWER -->
<div id="viewer" class="hidden">
  <span class="close" onclick="closeViewer()">×</span>
  <button id="prevImg">&#10094;</button>
  <img id="viewerImg">
  <button id="nextImg">&#10095;</button>
</div>

<script>
document.getElementById('year').textContent = new Date().getFullYear();
</script>

</body>
</html>
